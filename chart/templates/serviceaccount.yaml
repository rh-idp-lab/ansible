apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "idp-lab.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "idp-lab.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave.rbac | quote }}
