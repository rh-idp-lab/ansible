{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "idp-lab.fullname" . }}
  labels:
    {{- include "idp-lab.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave.rbac | quote }}
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - services
      - serviceaccounts
      - pods
      - namespaces
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # RBAC resources
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]

  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # OpenShift Routes
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
      - routes/custom-host
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # OpenShift Images
  - apiGroups: ["image.openshift.io"]
    resources:
      - imagestreams
      - imagestreamtags
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Batch (Jobs, CronJobs)
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # OpenShift Config
  - apiGroups: ["config.openshift.io"]
    resources:
      - ingresses
      - clusterversions
      - infrastructures
      - networks
    verbs: ["get", "list", "watch"]

  # OpenShift Operator
  - apiGroups: ["operator.openshift.io"]
    resources:
      - ingresscontrollers
      - kubeapiservers
      - openshiftapiservers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # OpenShift Project
  - apiGroups: ["project.openshift.io"]
    resources:
      - projects
      - projectrequests
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # OpenShift User & Security
  - apiGroups: ["user.openshift.io"]
    resources:
      - users
      - groups
      - identities
    verbs: ["get", "list", "watch"]

  - apiGroups: ["security.openshift.io"]
    resources:
      - securitycontextconstraints
    verbs: ["get", "list", "watch", "use"]

  # OpenShift Template
  - apiGroups: ["template.openshift.io"]
    resources:
      - templates
      - templateinstances
      - processedtemplates
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Helm (for ArgoCD)
  - apiGroups: ["helm.openshift.io"]
    resources:
      - helmchartrepositories
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Machine Config (read-only)
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources:
      - machineconfigs
      - machineconfigpools
    verbs: ["get", "list", "watch"]

  # API Server & CRDs
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  {{- with .Values.rbac.additionalRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
