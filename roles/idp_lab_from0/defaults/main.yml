idp_lab_from0_openshift_gitops_applicationset_controller_requests_memory: 512Mi
idp_lab_from0_openshift_gitops_applicationset_controller_limits_cpu: "2"
idp_lab_from0_openshift_gitops_applicationset_controller_limits_memory: 1Gi

# Application Controller
idp_lab_from0_openshift_gitops_controller_update: true
idp_lab_from0_openshift_gitops_controller_requests_cpu: 512m
idp_lab_from0_openshift_gitops_controller_requests_memory: 1Gi
