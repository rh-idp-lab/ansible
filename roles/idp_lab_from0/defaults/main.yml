idp_lab_from0_openshift_gitops_dex_requests_cpu: 125m
idp_lab_from0_openshift_gitops_dex_requests_memory: 128Mi
idp_lab_from0_openshift_gitops_dex_limits_cpu: 500m
idp_lab_from0_openshift_gitops_dex_limits_memory: 256Mi

# Server
idp_lab_from0_openshift_gitops_server_update: false
idp_lab_from0_openshift_gitops_server_requests_cpu: 250m
idp_lab_from0_openshift_gitops_server_requests_memory: 128Mi
idp_lab_from0_openshift_gitops_server_limits_cpu: 500m
idp_lab_from0_openshift_gitops_server_limits_memory: 256Mi

idp_lab_from0_openshift_gitops_resource_customizations: |
  operators.coreos.com/Subscription:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          numDegraded = 0
          numPending = 0
          msg = ""
          for i, condition in pairs(obj.status.conditions) do
            msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
            if condition.type == "InstallPlanPending" and condition.status == "True" then
              numPending = numPending + 1
            elseif (condition.type == "InstallPlanMissing" and condition.reason ~= "ReferencedInstallPlanNotFound") then
              numDegraded = numDegraded + 1
            elseif (condition.type == "CatalogSourcesUnhealthy" or condition.type == "InstallPlanFailed") and condition.status == "True" then
              numDegraded = numDegraded + 1
            end
          end
          if numDegraded == 0 and numPending == 0 then
            health_status.status = "Healthy"
            health_status.message = msg
            return health_status
          elseif numPending > 0 and numDegraded == 0 then
            health_status.status = "Progressing"
            health_status.message = "An install plan for a subscription is pending installation"
            return health_status
          else
            health_status.status = "Degraded"
            health_status.message = msg
            return health_status
          end
        end
      end
      health_status.status = "Progressing"
      health_status.message = "An install plan for a subscription is pending installation"
      return health_status

  quay.redhat.com/QuayRegistry:
    health.lua: |
      local hs={ status = "Progressing", message = "Waiting for initialization" }
      found_status = false

      if obj.status ~= nil then
        found_status = true
        if obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do

            if condition.type == "Available" and condition.status ~= "True" then
              if condition.reason == "ComponentNotReady" then
                hs.status = "Progressing"
              else
                hs.status = "Degraded"
              end
              hs.message = condition.message or condition.reason
            end
            if condition.type == "Available" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "All instances are available"
            end
          end
        end
      end

      if not found_status then
        hs = { status = "Progressing", message = "Instance is waiting for initialization" }
      end

      return hs

idp_lab_from0_openshift_gitops_ignore_differences: {}

idp_lab_from0_openshift_gitops_rbac_update: true

idp_lab_from0_openshift_gitops_rbac_policy: |
      g, cluster-admins, role:admin
      g, system:authenticated, role:readonly

# Users to add to the cluster-admins OpenShift group so they get ArgoCD admin via SSO
idp_lab_from0_openshift_gitops_cluster_admins_group_users:
  - admin
  - opentlc-mgr

# ------------------------------------------------
# Keycloak
# ------------------------------------------------

idp_lab_from0_keycloak_namespace: keycloak

# ------------------------------------------------
# GitLab
# ------------------------------------------------

idp_lab_from0_gitlab_namespace: gitlab

# Repos to delete and re-import from GitHub during make gitlab-reset
# Each entry specifies the target GitLab group and the GitHub source
idp_lab_from0_gitlab_reset_repos:
  - name: helm
    url: https://github.com/rh-idp-lab/helm.git
    group: idp-lab
  - name: opencodequest-templates
    url: https://github.com/rh-idp-lab/opencodequest-templates.git
    group: rhdh

idp_lab_from0_gitlab_gitops_repo: https://github.com/rh-idp-lab/helm.git
idp_lab_from0_gitlab_gitops_repo_path: gitlab
idp_lab_from0_gitlab_gitops_repo_tag: main
idp_lab_from0_gitlab_gitops_name: gitlab
idp_lab_from0_gitlab_gitops_namespace: openshift-gitops

idp_lab_from0_gitlab_config_smtp_host: >-
  smtp.gitlab-{{ idp_lab_from0_gitlab_namespace }}.{{ r_openshift_subdomain }}
idp_lab_from0_gitlab_config_ssh_host: >-
  ssh.gitlab-{{ idp_lab_from0_gitlab_namespace }}.{{ r_openshift_subdomain }}
idp_lab_from0_gitlab_config_root_password: "{{ common_password }}"
idp_lab_from0_gitlab_config_host: >-
  gitlab-{{ idp_lab_from0_gitlab_namespace }}.{{ r_openshift_subdomain }}

idp_lab_from0_gitlab_users_password: "{{ common_password }}"

# Static lab users (override to customise)
idp_lab_from0_gitlab_user1: user1
idp_lab_from0_gitlab_user2: user2
idp_lab_from0_gitlab_user3: user3

# GitLab OAuth applications to create automatically
idp_lab_from0_gitlab_oauth_apps:
  - name: devspaces
    redirect_uri: "https://devspaces.{{ r_openshift_subdomain }}/api/oauth/callback"
    scopes: "api read_user read_repository write_repository openid profile email"

