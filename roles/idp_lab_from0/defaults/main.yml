idp_lab_from0_openshift_gitops_redis_requests_memory: 128Mi
idp_lab_from0_openshift_gitops_redis_limits_cpu: 500m
idp_lab_from0_openshift_gitops_redis_limits_memory: 256Mi

# Repo Server
idp_lab_from0_openshift_gitops_repo_update: true
idp_lab_from0_openshift_gitops_repo_requests_cpu: 500m
idp_lab_from0_openshift_gitops_repo_requests_memory: 512Mi
idp_lab_from0_openshift_gitops_repo_limits_cpu: "2"
idp_lab_from0_openshift_gitops_repo_limits_memory: 2Gi

# DEX
