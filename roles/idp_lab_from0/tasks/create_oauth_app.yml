---
- name: Normalize existing OAuth apps list
  ansible.builtin.set_fact:
    _existing_oauth_apps: "{{ get_apps_response.json if get_apps_response.json | type_debug == 'list' else [] }}"

- name: Check if OAuth app '{{ oauth_app.name }}' already exists
  ansible.builtin.set_fact:
    oauth_app_exists: >-
      {{
        _existing_oauth_apps
        | json_query('[?name==`' + oauth_app.name + '` && redirect_uri==`' + oauth_app.redirect_uri + '`]')
        | length > 0
      }}

- name: Create OAuth application '{{ oauth_app.name }}' if not present
  uri:
    url: "https://{{ idp_lab_from0_gitlab_config_host }}/api/v4/applications"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ _idp_lab_from0_gitlab_root_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ oauth_app.name }}"
      redirect_uri: "{{ oauth_app.redirect_uri }}"
      scopes: "{{ oauth_app.scopes }}"
      trusted: true
    status_code: 201
  when: not oauth_app_exists
  register: oauth_app_create_response

- name: Store OAuth credentials for '{{ oauth_app.name }}' in a Kubernetes Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "gitlab-oauth-{{ oauth_app.name }}"
        namespace: "{{ idp_lab_from0_gitlab_namespace }}"
      stringData:
        application_id: "{{ oauth_app_create_response.json.application_id | string }}"
        secret: "{{ oauth_app_create_response.json.secret }}"
  when:
    - not oauth_app_exists
    - oauth_app_create_response is defined
    - oauth_app_create_response.json is defined

- name: Show result for OAuth app '{{ oauth_app.name }}'
  ansible.builtin.debug:
    msg: >-
      {% if oauth_app_create_response is defined and oauth_app_create_response.json is defined %}
        Created '{{ oauth_app.name }}' — App ID: {{ oauth_app_create_response.json.application_id }}, Secret stored in gitlab/gitlab-oauth-{{ oauth_app.name }}
      {% elif oauth_app_exists %}
        OAuth app '{{ oauth_app.name }}' already exists — skipping.
      {% else %}
        Unknown state for '{{ oauth_app.name }}'.
      {% endif %}
