---
- name: Create Vault ArgoCD application
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'vault/vault-application.yml.j2') | from_yaml }}"
  retries: 10
  delay: 30
  ignore_errors: true
  register: vault_result
  until: vault_result is not failed

- name: Print vault_result
  ansible.builtin.debug:
    var: vault_result
