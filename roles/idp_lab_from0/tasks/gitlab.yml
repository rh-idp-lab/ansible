---
- name: Create GitLab ArgoCD application
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'gitlab/gitlab-application.yml.j2') | from_yaml }}"
  retries: 10
  delay: 30
  ignore_errors: true
  register: gitlab_result
  until: gitlab_result is not failed

- name: Print gitlab_result
  ansible.builtin.debug:
    var: gitlab_result

- name: Retrieve GitLab root private token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: root-user-personal-token
    namespace: "{{ idp_lab_from0_gitlab_namespace }}"
  register: r_root_token
  retries: 120
  delay: 10
  ignore_errors: true
  until:
    - r_root_token is defined
    - r_root_token.resources is defined
    - r_root_token.resources | length > 0
    - r_root_token.resources[0] is defined
    - r_root_token.resources[0].data is defined
    - r_root_token.resources[0].data.token is defined
    - r_root_token.resources[0].data.token | length > 0

- name: Decode root token
  ansible.builtin.set_fact:
    _idp_lab_from0_gitlab_root_token: "{{ r_root_token.resources[0].data.token | b64decode }}"

- name: Wait for GitLab API to be fully ready
  ansible.builtin.uri:
    url: "https://{{ idp_lab_from0_gitlab_config_host }}/api/v4/groups"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ _idp_lab_from0_gitlab_root_token }}"
    validate_certs: false
  register: r_gitlab_api_ready
  retries: 60
  delay: 10
  until: r_gitlab_api_ready.status == 200

# OAuth applications (e.g. Dev Spaces) are created manually by lab participants
# as part of the workshop exercises — no automated creation here.

- name: Ensure lab users exist in GitLab with common_password
  ansible.builtin.include_tasks: gitlab_ensure_user.yml
  vars:
    gitlab_username: "{{ item }}"
  loop:
    - "{{ idp_lab_from0_gitlab_user1 }}"
    - "{{ idp_lab_from0_gitlab_user2 }}"
    - "{{ idp_lab_from0_gitlab_user3 }}"


- name: Register GitLab helm repo in ArgoCD (with root PAT)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-repo-gitlab-helm
        namespace: openshift-gitops
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      stringData:
        type: git
        url: "https://gitlab-{{ idp_lab_from0_gitlab_namespace }}.{{ r_openshift_subdomain }}/idp-lab/helm.git"
        username: root
        password: "{{ _idp_lab_from0_gitlab_root_token }}"
