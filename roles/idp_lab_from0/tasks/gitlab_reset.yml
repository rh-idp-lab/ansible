---
# Delete seeded repos and re-import them from GitHub — no ArgoCD sync needed.

- name: Retrieve GitLab root private token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: root-user-personal-token
    namespace: "{{ idp_lab_from0_gitlab_namespace }}"
  register: r_root_token
  retries: 5
  delay: 10
  until:
    - r_root_token.resources is defined
    - r_root_token.resources | length > 0
    - r_root_token.resources[0].data.token is defined

- name: Decode root token
  ansible.builtin.set_fact:
    _idp_lab_from0_gitlab_root_token: "{{ r_root_token.resources[0].data.token | b64decode }}"
    _gitlab_api: "https://{{ idp_lab_from0_gitlab_config_host }}/api/v4"

- name: Get all projects in each seeded group
  ansible.builtin.uri:
    url: "{{ _gitlab_api }}/groups/{{ item }}/projects?per_page=100"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ _idp_lab_from0_gitlab_root_token }}"
    return_content: true
    validate_certs: false
    status_code: [200, 404]
  loop: "{{ idp_lab_from0_gitlab_reset_groups }}"
  register: r_group_projects
  failed_when: false

- name: Delete all projects in seeded groups
  ansible.builtin.uri:
    url: "{{ _gitlab_api }}/projects/{{ item.id }}"
    method: DELETE
    headers:
      PRIVATE-TOKEN: "{{ _idp_lab_from0_gitlab_root_token }}"
    validate_certs: false
    status_code: [202, 404]
  loop: >-
    {{
      r_group_projects.results
      | selectattr('status', 'equalto', 200)
      | map(attribute='json')
      | select('iterable')
      | reject('string')
      | flatten(levels=1)
    }}
  loop_control:
    label: "{{ item.path_with_namespace }}"
  failed_when: false

- name: Get group IDs for seeded groups
  ansible.builtin.uri:
    url: "{{ _gitlab_api }}/groups/{{ item }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ _idp_lab_from0_gitlab_root_token }}"
    validate_certs: false
    status_code: 200
  loop: "{{ idp_lab_from0_gitlab_reset_groups }}"
  register: r_group_ids

- name: Re-import repos from GitHub into seeded groups
  ansible.builtin.uri:
    url: "{{ _gitlab_api }}/projects"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ _idp_lab_from0_gitlab_root_token }}"
    body_format: form-urlencoded
    body:
      name: "{{ item.1.name }}"
      import_url: "{{ item.1.url }}"
      visibility: public
      namespace_id: "{{ (r_group_ids.results | selectattr('item', 'equalto', item.0) | first).json.id }}"
    validate_certs: false
    status_code: [201, 400]
  loop: "{{ idp_lab_from0_gitlab_reset_groups | zip(idp_lab_from0_gitlab_reset_repos) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1.name }}"
  register: r_reimport
  retries: 5
  delay: 10
  until: r_reimport.status in [201, 400]

- name: Print result
  ansible.builtin.debug:
    msg: "GitLab reset complete: {{ idp_lab_from0_gitlab_reset_groups | join(', ') }} groups re-seeded"
  when: not silent | bool
