---
- name: Retrieve GitLab root private token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: root-user-personal-token
    namespace: "{{ idp_lab_from0_gitlab_namespace }}"
  register: r_root_token
  retries: 5
  delay: 10
  until:
    - r_root_token.resources is defined
    - r_root_token.resources | length > 0
    - r_root_token.resources[0].data.token is defined

- name: Decode root token
  ansible.builtin.set_fact:
    _idp_lab_from0_gitlab_root_token: "{{ r_root_token.resources[0].data.token | b64decode }}"

- name: Get all projects in each seeded group
  ansible.builtin.uri:
    url: "https://{{ idp_lab_from0_gitlab_config_host }}/api/v4/groups/{{ item }}/projects?per_page=100"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ _idp_lab_from0_gitlab_root_token }}"
    return_content: true
    status_code: [200, 404]
  loop: "{{ idp_lab_from0_gitlab_reset_groups }}"
  register: r_group_projects
  failed_when: false

- name: Delete all projects in seeded groups
  ansible.builtin.uri:
    url: "https://{{ idp_lab_from0_gitlab_config_host }}/api/v4/projects/{{ item.id }}"
    method: DELETE
    headers:
      PRIVATE-TOKEN: "{{ _idp_lab_from0_gitlab_root_token }}"
    status_code: [202, 404]
  loop: >-
    {{
      r_group_projects.results
      | selectattr('status', 'equalto', 200)
      | map(attribute='json')
      | select('iterable')
      | reject('string')
      | flatten(levels=1)
    }}
  loop_control:
    label: "{{ item.path_with_namespace }}"
  failed_when: false

- name: Patch ArgoCD Application to skip initial wait (GitLab already running)
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ idp_lab_from0_gitlab_gitops_name }}"
    namespace: "{{ idp_lab_from0_gitlab_gitops_namespace }}"
    definition:
      spec:
        source:
          helm:
            parameters:
              - name: gitlab.skipInitialWait
                value: "true"
    merge_type: merge

- name: Delete GitLab init Job so ArgoCD recreates it (without the 5-min pause)
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: initialize-gitlab
    namespace: "{{ idp_lab_from0_gitlab_namespace }}"
  ignore_errors: true

- name: Delete GitLab templates Job so ArgoCD recreates it
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: gitlab-templates
    namespace: "{{ idp_lab_from0_gitlab_namespace }}"
  ignore_errors: true

- name: Trigger ArgoCD sync operation
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ idp_lab_from0_gitlab_gitops_name }}"
    namespace: "{{ idp_lab_from0_gitlab_gitops_namespace }}"
    definition:
      operation:
        initiatedBy:
          username: ansible
        sync:
          syncStrategy:
            hook: {}
    merge_type: merge

- name: Wait for ArgoCD to recreate and complete init Job
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: initialize-gitlab
    namespace: "{{ idp_lab_from0_gitlab_namespace }}"
  register: r_init_job
  retries: 60
  delay: 10
  until:
    - r_init_job.resources is defined
    - r_init_job.resources | length > 0
    - r_init_job.resources[0].status is defined
    - r_init_job.resources[0].status.succeeded is defined
    - r_init_job.resources[0].status.succeeded >= 1

- name: Restore ArgoCD Application (remove skipInitialWait override)
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ idp_lab_from0_gitlab_gitops_name }}"
    namespace: "{{ idp_lab_from0_gitlab_gitops_namespace }}"
    definition:
      spec:
        source:
          helm:
            parameters:
              - name: gitlab.skipInitialWait
                value: "false"
    merge_type: merge
