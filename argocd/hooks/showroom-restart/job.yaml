---
apiVersion: batch/v1
kind: Job
metadata:
  name: showroom-rollout-restart
  namespace: showroom
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: showroom-restart
      restartPolicy: OnFailure
      containers:
        - name: restart
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              oc rollout restart deployment/showroom -n showroom
              oc rollout status deployment/showroom -n showroom --timeout=300s
